<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C42F3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="合格デスク">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>準1級 合格デスク</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column (max 600px), compact sticky header with countdown, fixed bottom tab bar; quiz card uses the "red sheet" study motif */
:root{
  --paper:#EDF0F3; --card:#FFFFFF; --ink:#18212C; --muted:#5A6878; --line:#D3DAE2; --soft:#E3E8EE;
  --accent:#C42F3B; --accent-soft:#F7DCDF; --on-accent:#FFFFFF; --blue:#1F4FB8;
  --ok:#1D7F50; --ok-soft:#D8F0E3; --warn:#9A6514; --warn-soft:#F6EBD2; --bad:#B42335; --bad-soft:#F8DDE1;
  --s-voc:#2F6FDB; --s-read:#0F8C80; --s-lis:#7E52CC; --s-sum:#C9741F; --s-ess:#BE3C77; --s-spk:#55852A;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"Newsreader","Georgia","Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:14px; --nav:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161C; --card:#19202A; --ink:#E5EAF0; --muted:#95A2B1; --line:#2B3541; --soft:#222B36;
  --accent:#EE5D68; --accent-soft:#3D1D22; --on-accent:#1A0E10; --blue:#86A9F5;
  --ok:#4CC38A; --ok-soft:#173327; --warn:#E2AE4A; --warn-soft:#3A2E15; --bad:#F07080; --bad-soft:#3C1C22;
  --s-voc:#6E9BF0; --s-read:#3FC1B2; --s-lis:#A887EA; --s-sum:#E7A25C; --s-ess:#E570A6; --s-spk:#8CC35A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161C; --card:#19202A; --ink:#E5EAF0; --muted:#95A2B1; --line:#2B3541; --soft:#222B36;
  --accent:#EE5D68; --accent-soft:#3D1D22; --on-accent:#1A0E10; --blue:#86A9F5;
  --ok:#4CC38A; --ok-soft:#173327; --warn:#E2AE4A; --warn-soft:#3A2E15; --bad:#F07080; --bad-soft:#3C1C22;
  --s-voc:#6E9BF0; --s-read:#3FC1B2; --s-lis:#A887EA; --s-sum:#E7A25C; --s-ess:#E570A6; --s-spk:#8CC35A;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.en{font-family:var(--f-en)}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding-block:6px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:.85rem;flex:none}
.brand h1{font-size:1rem;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.count{display:flex;align-items:baseline;gap:4px;white-space:nowrap;font-size:.75rem;color:var(--muted)}
.count b{font-family:var(--f-num);font-size:1.35rem;color:var(--accent)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nb{border:0;background:none;height:var(--nav);display:grid;place-items:center;align-content:center;gap:2px;color:var(--muted);font-size:.68rem;font-weight:500;cursor:pointer;position:relative}
.nb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{color:var(--accent);font-weight:700}
.nb .badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--accent);color:var(--on-accent);font-family:var(--f-num);font-size:.6rem;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}

main{padding-block:14px calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:.76rem;color:var(--muted);font-weight:500;letter-spacing:.03em}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%;font-size:16px;min-height:46px}
textarea{resize:vertical;line-height:1.6}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .wide{grid-column:1/-1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.block{width:100%;min-height:50px;font-size:1.02rem}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:.86rem;border-radius:10px}
.btn.icon{min-width:44px;padding:0;border-color:transparent;background:none;color:var(--muted);font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.sk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.chip.good{background:var(--ok-soft);color:var(--ok)} .chip.mid{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:.88rem;white-space:nowrap;cursor:pointer;color:var(--muted);min-height:38px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700}
.note{font-size:.84rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}
.banner{display:grid;gap:8px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.88rem}
.empty{padding:20px 14px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:12px}
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:50px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--accent);font-size:1.2rem}
details.fold[open]>summary::after{content:"−"}
details.fold>.in{padding:0 16px 16px;display:grid;gap:12px}
details.sub>summary{cursor:pointer;font-size:.86rem;color:var(--blue);padding:4px 0}

/* home */
.cd{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.cd>div{background:var(--card);padding:14px}
.cd .k{font-size:.76rem;color:var(--muted)}
.cd .d{font-family:var(--f-num);font-size:2.3rem;line-height:1.1;color:var(--accent)}
.cd .d small{font-family:var(--f-ui);font-size:.85rem;color:var(--ink);margin-left:2px}
.cd .dt{font-size:.78rem}
.cd .past .d{color:var(--muted);font-size:1.2rem}
.phase{display:inline-block;font-weight:700;font-size:.8rem;color:var(--card);background:var(--ink);padding:2px 10px;border-radius:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--card);padding:12px 14px}
.stat b{display:block;font-family:var(--f-num);font-size:1.4rem;line-height:1.2}
.stat span{font-size:.75rem;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.book{display:grid;gap:5px}
.book-h{display:flex;justify-content:space-between;gap:8px;font-size:.86rem}

/* lists */
.list{display:grid}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{min-width:0;overflow-wrap:anywhere}
.item.done .t .ttl{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;accent-color:var(--accent);margin:0}
.complete{grid-column:1/-1;display:grid;gap:8px;background:var(--soft);padding:12px;border-radius:12px}
.complete .row input{width:96px}

/* words */
.wcard{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.wcard:first-child{border-top:0}
.wtop{display:flex;align-items:center;gap:4px;justify-content:space-between}
.wtop .w{font-family:var(--f-en);font-size:1.3rem;font-weight:600;overflow-wrap:anywhere;min-width:0}
.wmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.boxes{display:inline-flex;gap:2px}
.boxes i{width:9px;height:9px;border-radius:2px;background:var(--soft);border:1px solid var(--line)}
.boxes i.on{background:var(--s-voc);border-color:var(--s-voc)}
.boxes.m i.on{background:var(--ok);border-color:var(--ok)}

/* quiz */
.qprog{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 16px;display:grid;gap:14px;text-align:center}
.qword{font-family:var(--f-en);font-size:2.2rem;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.qword.ja{font-family:var(--f-ui);font-size:1.4rem}
.qmeta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer;font-size:1.02rem;display:flex;gap:10px;align-items:center}
.opt kbd{font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.en-o{font-family:var(--f-en);font-size:1.15rem}
@media (hover:none){.opt kbd{display:none}}
.sheet-zone{position:relative;border-radius:12px;min-height:110px;display:grid;place-items:center;padding:14px;cursor:pointer}
.sheet-ans{color:var(--accent);font-weight:700;font-size:1.3rem}
.sheet-ex{font-family:var(--f-en);font-style:italic;color:var(--muted);font-size:.98rem;margin-top:4px}
.sheet{position:absolute;inset:0;border-radius:12px;background:var(--accent);opacity:.94;display:grid;place-items:center;color:var(--on-accent);font-size:.85rem;letter-spacing:.12em;transition:transform .35s ease,opacity .35s}
.sheet.off{transform:translateY(110%);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.selfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feedback{font-weight:700}
.feedback.ok{color:var(--ok)} .feedback.ng{color:var(--bad)}
.big-score{font-family:var(--f-num);font-size:3rem;line-height:1}

/* charts */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-num)}
.legend{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend span::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--soft);max-width:100%}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--soft))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--soft))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--soft))}
.heat i.l4{background:var(--accent)}
.hbar{display:grid;grid-template-columns:5.2em 1fr 4.6em;gap:8px;align-items:center;font-size:.84rem}
.hbar .bar{height:10px}
.timer{font-family:var(--f-num);font-size:2.6rem;line-height:1;text-align:center}

/* mock */
.mcard{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mcard:first-child{border-top:0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mgrid>div{background:var(--paper);border-radius:10px;padding:8px;text-align:center;min-width:0}
.mgrid b{display:block;font-family:var(--f-num);font-size:1.05rem}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-grid .field input{text-align:right}
.groupt{grid-column:1/-1;font-size:.78rem;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:2px;margin-top:4px}

/* writing */
.wc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wc b{font-family:var(--f-num);font-size:1.4rem}
.range{position:relative;height:10px;background:var(--soft);border-radius:99px;flex:1;min-width:120px}
.range .zone{position:absolute;top:0;bottom:0;background:var(--ok-soft);border:1px solid var(--ok);border-radius:99px}
.range .pin{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.essay-text{font-family:var(--f-en);font-size:1.05rem}
.checks{display:grid;gap:8px;font-size:.92rem}
.checks label{display:flex;gap:10px;align-items:flex-start}
.selfsc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.tplbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.tplbox summary{cursor:pointer;font-weight:700;font-size:.92rem}
details.tplbox[open] summary{margin-bottom:8px}
.tpl{font-family:var(--f-en);font-size:.95rem;background:var(--paper);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.essay-item summary{cursor:pointer;padding:10px 0;font-size:.9rem}

/* more / guide */
.menu{display:grid;gap:10px}
.menu button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.menu svg{width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu b{display:block}
.menu span{font-size:.8rem;color:var(--muted)}
.guide{display:grid;gap:10px;font-size:.92rem}
.guide ul,.guide ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.fmt{display:grid;gap:8px}
.fmt>div{display:grid;gap:3px;padding:10px 12px;background:var(--paper);border-radius:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sync{font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 18px;border-radius:99px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="mark" aria-hidden="true">準1</span><h1>合格デスク</h1></div>
    <div class="count" id="count"></div>
  </div>
</header>
<main class="wrap" id="main"></main>
<nav class="nav" aria-label="画面"><div class="nav-in" id="nav"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- constants ---------- */
const SK = {
  voc:{n:'語彙', c:'var(--s-voc)'}, read:{n:'読解', c:'var(--s-read)'}, lis:{n:'リスニング', c:'var(--s-lis)'},
  sum:{n:'要約', c:'var(--s-sum)'}, ess:{n:'意見文', c:'var(--s-ess)'}, spk:{n:'面接', c:'var(--s-spk)'}
};
const BK = {pass:'でる順パス単', kyo:'総合対策教本', kako:'過去6回全問題集', app:'このアプリ', other:'その他'};
const SEC = ['単語 でる度A','単語 でる度B','単語 でる度C','熟語 でる度A','熟語 でる度B','過去問で出た','その他'];
const SRC = {pass:'パス単', kako:'過去問', kyo:'教本', other:'その他'};
const INT = [0,1,2,4,7,15,30]; // Leitner box -> 次の復習まで(日)
const MASTER = 6;
const MOCK = [ // 2024年度リニューアル後の問題数（ライティングは観点別4点×4）
  {k:'voc', n:'語彙 (大問1)', max:18, g:'R'}, {k:'cloze', n:'空所補充 (大問2)', max:6, g:'R'}, {k:'comp', n:'内容一致 (大問3)', max:7, g:'R'},
  {k:'sum', n:'要約', max:16, g:'W'}, {k:'ess', n:'意見論述', max:16, g:'W'},
  {k:'l1', n:'Part1 会話', max:12, g:'L'}, {k:'l2', n:'Part2 文章', max:6, g:'L'}, {k:'l3', n:'Part3 Real-Life', max:5, g:'L'}
];
const IC = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',

const KEYS = ['words','todos','logs','mocks','essays','settings'];
const DEFAULT_SETTINGS = {exam:'2027-01-24', exam2a:'2027-02-28', exam2b:'2027-03-07', exam2pick:'', daily:40, dailyMin:120, kyoDone:0, kyoTotal:20, pv:2};
let S = {words:[], todos:[], logs:[], mocks:[], essays:[], settings:{...DEFAULT_SETTINGS}};
let db = null, me = null, syncMode = 'local';
const LS = 'eikenp1:';
function lsGet(k){ try{ const v = localStorage.getItem(LS+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
function fixSettings(s){
  const old = !s?.pv;   // 1日2時間プランより前の設定: 新出語数を40語以上、最低学習時間を120分にする
  s = {...DEFAULT_SETTINGS, ...(s||{})};
  ['exam','exam2a','exam2b'].forEach(k => { if (!s[k]) s[k] = DEFAULT_SETTINGS[k]; });
  if (old) { s.daily = Math.max(+s.daily || 0, 40); s.dailyMin = 120; s.pv = 2; }
  return s;
}
const dirty = new Set(); let flushT;
function save(k){ lsSet(k, S[k]); dirty.add(k); clearTimeout(flushT); flushT = setTimeout(flush, 700); }
const CHUNK = 250;
const dpath = k => `data/users/${me}/${k}`;
async function flush(){
  if (!db || !me) return;
  for (const k of [...dirty]) {
    dirty.delete(k);
    try {
      if (k === 'settings') { await db.doc(dpath(k)).set({v:S.settings, at:Date.now()}); }
      else {
        const arr = S[k], n = Math.max(1, Math.ceil(arr.length / CHUNK));
        const prev = (await db.doc(dpath(k)).get()).data?.()?.n || 0;
        for (let i=0;i<n;i++) await db.doc(dpath(`${k}.${i}`)).set({v:arr.slice(i*CHUNK,(i+1)*CHUNK)});
        for (let i=n;i<prev;i++) await db.doc(dpath(`${k}.${i}`)).delete();
        await db.doc(dpath(k)).set({n, at:Date.now()});
      }
      setSync('ok');
    } catch(e) {
      if (e?.code === 'unavailable') { dirty.add(k); setTimeout(flush, 1500 + Math.random()*1000); }
      setSync('err', e?.code === 'quota_exceeded' ? '保存容量の上限です' : '保存に失敗しました');
    }
  }
}
async function loadRemote(){
  const out = {}; let any = false;
  for (const k of KEYS) {
    const snap = await db.doc(dpath(k)).get();
    if (!snap.exists) continue;
    any = true;
    const d = snap.data();
    if (k === 'settings') { out[k] = fixSettings(d.v); continue; }
    let arr = [];
    for (let i=0;i<(d.n||0);i++){ const c = await db.doc(dpath(`${k}.${i}`)).get(); if (c.exists) arr = arr.concat(c.data().v || []); }
    out[k] = arr;
  }
  return any ? out : null;
}
function setSync(mode, msg){ syncMode = mode; const el = $('#syncState'); if (el) el.outerHTML = syncHtml(msg); }
function syncHtml(msg){
  const t = {local:'この端末のブラウザに保存', ok:'アカウントに保存済み', err: msg || '保存エラー', wait:'読み込み中…'}[syncMode];
  return `<span id="syncState" class="sync ${syncMode}"><i></i>${esc(t)}</span>`;
}
function loadLocal(){
  let found = false;
  for (const k of KEYS){ const v = lsGet(k); if (v != null){ if (k !== 'settings') found = true; S[k] = k==='settings' ? fixSettings(v) : v; } }
  return found;
}
async function initRemote(){
  const c = window.claude; if (!c?.use) { setSync('local'); return; }
  try {
    const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
    if (!d || !u) { setSync('local'); return; }
    const id = await u.id(); if (!id) { setSync('local'); return; }
    db = d; me = id; setSync('wait');
    const remote = await loadRemote();
    if (remote) { for (const k of KEYS) if (remote[k]) { S[k] = remote[k]; lsSet(k, S[k]); } render(); setSync('ok'); }
    else { const hasReal = KEYS.some(k => k!=='settings' && S[k].some(x => !x.sample)); if (hasReal) { KEYS.forEach(k => dirty.add(k)); flush(); } else setSync('ok'); }
  } catch(e) { db = null; setSync('local'); }
}

function minutesOn(date){ return S.logs.filter(l => l.date===date).reduce((a,l)=>a+(+l.min||0),0); }
function streak(){
  let d = today(), n = 0;
  if (!minutesOn(d)) d = addDays(d,-1);
  while (minutesOn(d) > 0) { n++; d = addDays(d,-1); }
  return n;
}
function goalDays(){ const t = today(); let n = 0; for (let i=0;i<7;i++) if (minutesOn(addDays(t,-i)) >= S.settings.dailyMin) n++; return n; }
function weekMinutes(){ const t = today(); let s=0; for (let i=0;i<7;i++) s += minutesOn(addDays(t,-i)); return s; }

const exam2 = () => { const s = S.settings; return s.exam2pick === 'b' ? s.exam2b : s.exam2a; };
const exam2Last = () => { const s = S.settings; return s.exam2pick === 'a' ? s.exam2a : (s.exam2b || s.exam2a); };
function daysLeft(){ return S.settings.exam ? diffDays(today(), S.settings.exam) : null; }
function phase(){
  const d = daysLeft(), t = today();
  if (d == null) return {k:'base', n:'基礎固め期', tip:'試験日を設定しましょう。'};
  if (d >= 0) {
    if (d <= 21) return {k:'final', n:'直前期', tip:'過去問2周目と要約・意見文を毎日。新しい単語より、間違えた単語の総復習を優先します。'};
    if (d <= 60) return {k:'drill', n:'演習期', tip:'過去6回全問題集を時間を計って週1回。解いた後の復習（語彙登録・スクリプト音読）に解く時間以上をかけます。'};
    return {k:'base', n:'基礎固め期', tip:'総合対策教本で各大問の解き方を学び、パス単は「でる度A」から1周目を終わらせます。'};

  return {k:'done', n:'試験終了', tip:'お疲れさまでした。次の試験日を設定すると、新しいプランが作れます。'};
}

      <div class="row"><button class="btn pri" data-act="finishTodo" data-id="${x.id}" data-log="1">記録して完了</button><button class="btn" data-act="finishTodo" data-id="${x.id}">記録せず完了</button><button class="btn ghost" data-act="cancelFinish">やめる</button></div></div>` : ''}
  </div>`;
}
let completing = null;

function legend(){ return `<div class="legend">${Object.values(SK).map(s=>`<span style="--c:${s.c}">${s.n}</span>`).join('')}</div>`; }
function barChart(n){
  const t = today(), days = Array.from({length:n}, (_,i) => addDays(t, i-n+1));
  const data = days.map(d => { const o = {}; S.logs.filter(l=>l.date===d).forEach(l => o[l.skill] = (o[l.skill]||0) + (+l.min||0)); return o; });
  const tot = data.map(o => Object.values(o).reduce((a,b)=>a+b,0));
  const maxV = Math.max(60, ...tot), step = maxV > 240 ? 120 : 60, top = Math.ceil(maxV/step)*step;
  const W = 360, H = 180, L = 28, B = 22, T = 8, bw = (W-L-4)/n;
  const y = v => T + (H-T-B) * (1 - v/top);
  let g = '';
  for (let v=0; v<=top; v+=step) g += `<line x1="${L}" x2="${W-2}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v/60}h</text>`;
  const every = Math.ceil(n/5);
  data.forEach((o,i) => {
    let acc = 0; const x = L + i*bw + bw*.16, w = bw*.68;
    Object.keys(SK).forEach(k => { if (!o[k]) return; const y0 = y(acc), y1 = y(acc+o[k]); g += `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1)}" fill="${SK[k].c}"><title>${md(days[i])} ${SK[k].n} ${o[k]}分</title></rect>`; acc += o[k]; });
    if ((n-1-i) % every === 0) g += `<text x="${x+w/2}" y="${H-6}" text-anchor="middle" ${days[i]===t?'style="fill:var(--ink);font-weight:700"':''}>${md(days[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近${n}日の学習時間（技能別）">${g}</svg>`;
}

/* ---------- QUIZ ---------- */
let qs = {pool:'due', sec:'', mode:'mc-ej', n:20};
let Q = null;
VIEW.quiz = () => Q ? (Q.finished ? quizResult() : quizPlay()) : quizSetup();
function poolWords(){
  let p = S.words;
  if (qs.sec) p = p.filter(w => w.sec === qs.sec);
  if (qs.pool === 'due') p = p.filter(w => w.box < MASTER && w.due <= today());
  if (qs.pool === 'weak') p = p.filter(w => weakWords().includes(w));
  if (qs.pool === 'new') p = p.filter(w => w.ok + w.ng === 0);
  return p;
}
function quizSetup(){
  const n = poolWords().length;
  const pools = [['due',`復習待ち ${dueWords().length}`],['weak',`苦手 ${weakWords().length}`],['new',`未出題 ${S.words.filter(w=>w.ok+w.ng===0).length}`],['all',`すべて ${S.words.length}`]];
  const modes = [['mc-ej','4択 英→日'],['mc-je','4択 日→英'],['card','赤シート'],['spell','つづり']];
  return `
  <section class="panel">
    <h2>単語クイズ</h2>
    <div class="field"><span class="lbl">出題範囲</span>${fchips('qpool', qs.pool, pools)}</div>

    <div class="form-grid">
      <div class="field"><label for="qsec">パス単の区分</label><select id="qsec" data-chg="qsec"><option value="">すべて</option>${SEC.map(s=>`<option ${s===qs.sec?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label for="qn">問題数</label><select id="qn" data-chg="qn">${[10,20,30,50,999].map(v=>`<option value="${v}" ${v===qs.n?'selected':''}>${v===999?'全部':v+'問'}</option>`).join('')}</select></div>
    </div>
    <button class="btn pri block" data-act="startQuiz" ${n?'':'disabled'}>${n ? `${Math.min(n,qs.n)}問で始める` : 'この範囲には単語がありません'}</button>
    ${qs.mode.startsWith('mc') && S.words.length < 4 ? '<p class="small muted">4択には単語が4語以上必要です。少ないうちは赤シートで出題します。</p>' : ''}
  </section>
  <div class="note">赤シートは、赤い帯をタップすると意味が見えます。思い出せたかを自分で判定してください。4択とつづりは自動で採点します。</div>`;
}
function startQuiz(words){
  const items = shuffle(words).slice(0, qs.n);
  let mode = qs.mode;
  if (mode.startsWith('mc') && S.words.length < 4) mode = 'card';
  Q = {mode, items: items.map(w => w.id), i:0, res:[], start:Date.now(), ans:null, opts:null, revealed:false};
  prepQ(); tab = 'quiz'; render(); window.scrollTo(0,0);
}
function prepQ(){
  const w = curW(); Q.ans = null; Q.revealed = false;
  if (Q.mode.startsWith('mc')) {
    const key = Q.mode === 'mc-ej' ? 'ja' : 'en';
    const others = shuffle(S.words.filter(x => x.id !== w.id && x[key] !== w[key])).slice(0,3).map(x => x[key]);
    Q.opts = shuffle([w[key], ...others]);
  }
}
const curW = () => S.words.find(w => w.id === Q.items[Q.i]);
function quizPlay(){
  const w = curW(); if (!w) { Q.finished = true; Q.end = Date.now(); return quizResult(); }
  const total = Q.items.length, done = Q.i;
  let body = '';
  const meta = `<div class="qmeta"><span class="chip">${esc(w.sec)}</span>${w.page?`<span class="chip">${esc(w.page)}</span>`:''}</div>`;
  if (Q.mode === 'mc-ej' || Q.mode === 'card') body = `<div class="qword">${esc(w.en)}</div><div><button class="btn sm" data-act="speak" data-t="${esc(w.en)}">🔊 発音</button></div>`;
  else body = `<div class="qword ja">${esc(w.ja)}</div>`;
  let ctrl = '';
  if (Q.mode.startsWith('mc')) {
    const key = Q.mode === 'mc-ej' ? 'ja' : 'en';
    ctrl = `<div class="opts">${Q.opts.map((o,i) => {
      let cls = Q.mode==='mc-je'?'en-o':'';
      if (Q.ans != null) { if (o === w[key]) cls += ' right'; else if (i === Q.ans) cls += ' wrong'; }
      return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${Q.ans!=null?'disabled':''}><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`; }).join('')}</div>`;
  } else if (Q.mode === 'card') {
    ctrl = `<div class="sheet-zone" data-act="reveal" role="button" tabindex="0" aria-label="意味を表示"><div><div class="sheet-ans">${esc(w.ja)}</div>${w.ex?`<div class="sheet-ex">${esc(w.ex)}</div>`:''}</div><div class="sheet ${Q.revealed?'off':''}">タップで めくる</div></div>
      ${Q.revealed && Q.ans==null ? `<div class="selfbtns"><button class="btn block" data-act="self" data-ok="0">✕ 忘れた</button><button class="btn pri block" data-act="self" data-ok="1">○ 覚えてた</button></div>` : ''}`;
  } else {
    ctrl = `<form data-form="spell" style="display:grid;gap:10px"><input type="text" id="keep-spell" name="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="en" style="font-size:1.25rem;text-align:center" ${Q.ans!=null?'disabled':''} placeholder="英語でつづる" aria-label="答え"><button class="btn pri block" ${Q.ans!=null?'disabled':''}>答える</button></form>
      ${Q.ans==null ? `<div class="small muted">ヒント: ${esc(w.en[0])}${'＿'.repeat(Math.max(0,w.en.length-1))}（${w.en.length}文字）</div>` : ''}`;
  }
  let fb = '';
  if (Q.ans != null) {
    const ok = Q.res[Q.res.length-1].ok;
    fb = `<div class="feedback ${ok?'ok':'ng'}">${ok?'正解':'不正解'}　<span class="en" style="font-weight:600">${esc(w.en)}</span> = ${esc(w.ja)}</div>
      ${w.ex && Q.mode!=='card' ? `<div class="sheet-ex">${esc(w.ex)}</div>` : ''}
      <button class="btn pri block" data-act="next" id="keep-next">${Q.i+1 < total ? '次へ' : '結果を見る'}</button>`;
  }
  return `
    <div class="qprog"><span class="num">${done+1} / ${total}　正解 ${Q.res.filter(r=>r.ok).length}</span><button class="btn sm ghost" data-act="quitQuiz">中断</button></div>
    <div class="bar"><i style="width:${done/total*100}%"></i></div>
    <div class="qcard">${meta}${body}${ctrl}${fb}</div>`;
}
AFTER.quiz = () => { const s = $('#keep-spell'); if (s && !s.disabled) s.focus(); };
function grade(ok){
  const w = curW(); const t = today();
  Q.res.push({id:w.id, ok});
  if (ok) { w.ok++; w.box = Math.min(MASTER, w.box+1); w.due = w.box >= MASTER ? addDays(t, 60) : addDays(t, INT[w.box]); }
  else { w.ng++; w.box = 0; w.due = t; }
  w.last = t; save('words');
}
function quizResult(){
  const ok = Q.res.filter(r=>r.ok).length, n = Q.res.length;
  const wrong = Q.res.filter(r=>!r.ok).map(r => S.words.find(w=>w.id===r.id)).filter(Boolean);
  const min = Math.max(1, Math.round((Q.end - Q.start)/60000));
  return `<section class="panel" style="text-align:center">
    <div class="big-score">${ok}<span class="muted" style="font-size:1.4rem"> / ${n}</span></div>
    <p>${n ? Math.round(ok/n*100) : 0}% 正解 · 約${min}分</p>
    ${Q.logged ? '<p class="small muted">学習記録に追加しました。</p>' : n ? `<button class="btn block" data-act="logQuiz">この ${min} 分を学習記録に追加</button>` : ''}
    ${wrong.length ? `<button class="btn pri block" data-act="retryWrong">間違えた ${wrong.length} 語だけもう一度</button>` : ''}
    <button class="btn block" data-act="quitQuiz">クイズ設定に戻る</button>
    ${wrong.length ? `<div style="text-align:left"><h3>間違えた単語</h3><div class="list">${wrong.map(w=>`<div class="item" style="grid-template-columns:1fr auto"><div class="t"><span class="en" style="font-weight:600;font-size:1.1rem">${esc(w.en)}</span><div class="small">${esc(w.ja)}</div></div><button class="btn icon" data-act="speak" data-t="${esc(w.en)}" aria-label="発音">🔊</button></div>`).join('')}</div></div>` : ''}
  </section>`;
}

// 1日120分を基準にした時期別メニュー。語彙 約35%・ライティング 約25%・読解/リスニング 約30%・話す型 約10%。
// 設定の「1日の最低学習時間」に合わせて、各TODOの時間を比例で伸び縮みさせる。
function dayMenu(k, day, i){
  const dw = S.settings.daily, m = [];
  const add = (title, skill, book, min) => m.push({title, skill, book, min});
  const write = () => i % 2
    ? add('要約 1本（60〜70語・20分で書く）→ 模範解答と比べて書き直す', 'sum', k === 'base' ? 'kyo' : 'kako', 30)
    : add('意見論述 1本（120〜150語・25分で書く）→ 見直しチェック', 'ess', k === 'base' ? 'kyo' : 'kako', 30);
  const pattern = () => add('話す型の練習: 型を1つ選び（While X, Y / 関係詞 / If I were…）3文作って声に出す', 'spk', 'other', 10);
  const pass = (min) => add(`パス単 新出${dw}語 → わからない語を単語帳へ`, 'voc', 'pass', min);
  const quiz = (min) => add('単語帳の復習待ちをクイズ', 'voc', 'app', min);
  if (k === 'base') {
    pass(35); quiz(10); write(); pattern();
    if ([1,3,5].includes(day)) add('総合対策教本 1章（例題を解いて解説を読む）', 'read', 'kyo', 35);
    else if ([2,4].includes(day)) add('教本のリスニング → 聞き取れなかった文をスクリプトで確認・音読', 'lis', 'kyo', 35);
    else if (day === 6) add('教本の長文問題を1題 → 精読して言い換え表現をメモ', 'read', 'kyo', 35);
    else add('1週間の総復習: 間違えた問題と単語をやり直す', 'read', 'kyo', 35);
  } else if (k === 'drill') {
    if (day === 6) { add('過去問 1回分 筆記（読解＋ライティング）を90分で通しで解く', 'read', 'kako', 90); pass(20); quiz(10); }
    else if (day === 0) { add('過去問 同じ回のリスニング → 採点 → スコアを「過去問」に記録', 'lis', 'kako', 45); add('過去問の解き直し: 知らなかった語彙・熟語を単語帳に登録', 'read', 'kako', 30); pass(35); quiz(10); }
    else if (day === 1) { add('過去問の要約・意見論述を書き直す（模範解答と比較）', 'sum', 'kako', 40); pass(35); quiz(10); pattern(); add('過去問リスニング スクリプトの音読', 'lis', 'kako', 25); }
    else if ([2,4].includes(day)) { pass(35); quiz(10); write(); pattern(); add('リスニング シャドーイング（過去問 Part1〜2）', 'lis', 'kako', 35); }
    else { pass(35); quiz(10); write(); pattern(); add('過去問の大問2・3を解き直して精読', 'read', 'kako', 35); }
  } else if (k === 'final') {
    if ([3,6].includes(day)) add('過去問 2周目 1回分を本番と同じ時間配分で（筆記90分＋リスニング30分）', 'read', 'kako', 120);
    else {
      add('苦手語・復習待ちを総ざらい（クイズ）', 'voc', 'app', 30); write();
      add('間違えた過去問のやり直し', 'read', 'kako', 25); add('リスニング スクリプトの音読', 'lis', 'kako', 20);
      add([2,5].includes(day) ? '面接: 4コマナレーション 1分準備＋2分で話す' : '話す型の練習: 3文作って声に出す', 'spk', 'kyo', 15);
    }
  } else if (k === 'spk') {
    add('4コマナレーション 2枚: 準備1分 → 2分で話す → 録音を聞き直す', 'spk', 'kyo', 30);
    add(i%2 ? '面接の質疑: 社会的な話題に「意見＋理由2つ」で答える（5問）' : '面接の質疑: 絵に関する質問・自分の意見を問う質問（5問）', 'spk', i%2 ? 'kyo' : 'kako', 30);
    add('話す型の練習: 意見を言う型（I believe… because… / While X, Y）を音読→自分の文で', 'spk', 'other', 20);
    add([0,3].includes(day) ? '教本の面接の章を読む・模範解答を音読' : '過去問の面接カードで模範解答を音読・暗唱', 'spk', 'kyo', 25);
    quiz(15);
  }
  return m;
}
function planFor(k){
  const t = today(), out = [], e1 = S.settings.exam, e2 = exam2Last();
  const f = Math.max(30, +S.settings.dailyMin || 120) / 120;
  for (let i=0;i<7;i++){
    const date = addDays(t,i), day = new Date(date+'T00:00:00').getDay();
    if (k !== 'spk' && e1 && date >= e1) break;   // 試験当日以降は入れない
    if (k === 'spk' && e2 && date >= e2) break;
    dayMenu(k, day, i).forEach(x => out.push({...x, min: Math.max(5, Math.round(x.min * f / 5) * 5), date, auto:true}));
  }
  return out;
}
function planPreview(k){
  if (k === 'done') return '試験日を新しく設定してください。';
  const p = planFor(k), m = p.reduce((a,x)=>a+x.min,0), days = new Set(p.map(x=>x.date)).size || 1;
  if (!p.length) return '試験の前日まで入れるTODOはありません。';
  return `${days}日間で ${p.length}件、合計 約${hm(m)}（1日 約${hm(Math.round(m/days))}）。すでに入っている自動プランの未完了分は、新しいプランに入れ替えます。`;
}
function addPlan(){
  const ph = phase(); if (ph.k === 'done') { toast('先に試験日を設定してください'); return; }
  const p = planFor(ph.k), dates = new Set(p.map(x => x.date));
  const before = S.todos.length;
  S.todos = S.todos.filter(x => !(x.auto && !x.done && dates.has(x.date)));   // 同じ日の古い自動プランは入れ替え
  const removed = before - S.todos.length;
  let n = 0;
  p.forEach(x => { if (!S.todos.some(y => y.date === x.date && y.title === x.title)) { S.todos.push({id:uid(), ...x, done:false}); n++; } });
  save('todos'); render(); toast(removed ? `${n}件のTODOに入れ替えました` : `${n}件のTODOを追加しました`);
}

function heatmap(){
  const t = today(), weeks = 15;
  const end = addDays(t, 6 - new Date(t+'T00:00:00').getDay());
  const start = addDays(end, -weeks*7+1);
  let h = '';
  for (let i=0;i<weeks*7;i++){
    const d = addDays(start, i), m = minutesOn(d);
    const l = d > t ? '' : m >= 120 ? 'l4' : m >= 60 ? 'l3' : m > 30 ? 'l2' : m > 0 ? 'l1' : '';
    h += `<i class="${l}" title="${md(d)} ${m}分" ${d>t?'style="opacity:.3"':''}></i>`;
  }
  return `<div class="heat" aria-label="直近15週の学習カレンダー">${h}</div>`;
}

/* ---------- events ---------- */
const ACT = {
  tab: el => { tab = el.dataset.k; render(); window.scrollTo(0,0); },
  clearSamples: () => { ['words','todos','logs'].forEach(k => { S[k] = S[k].filter(x => !x.sample); save(k); }); render(); toast('例を削除しました'); },
  plan: addPlan,
  kyo: el => { const s = S.settings; s.kyoDone = Math.max(0, Math.min(s.kyoTotal, s.kyoDone + +el.dataset.d)); save('settings'); render(); },
  quickQuiz: () => { qs.pool = 'due'; qs.sec = ''; startQuiz(poolWords()); },
  toggleTodo: el => { const x = S.todos.find(t => t.id === el.dataset.id); if (!x) return;
    if (x.done) { x.done = false; delete x.doneAt; save('todos'); render(); } else { completing = x.id; render(); } },

    if (el.dataset.log) { const m = +($('#keep-cmin')?.value) || x.min; if (m > 0) { S.logs.push({id:uid(), date:today(), skill:x.skill, book:x.book, min:m, text:x.title, todo:x.id}); save('logs'); } }
    completing = null; save('todos'); render(); toast(el.dataset.log ? '完了して記録しました' : '完了にしました'); },
  cancelFinish: () => { completing = null; render(); },
  delTodo: el => { S.todos = S.todos.filter(t => t.id !== el.dataset.id); save('todos'); render(); },
  tf: el => { tf = el.dataset.k; render(); },
  wst: el => { wf.st = el.dataset.k; wShow = 60; render(); },
  moreWords: () => { wShow += 60; render(); },
  editWord: el => { editing = el.dataset.id; render(); window.scrollTo(0,0); },
  cancelEdit: () => { editing = null; render(); },

  speak: el => speak(el.dataset.t),
  bulk: () => {
    const sec = $('#w-sec').value, src = $('#w-src').value, t = today();
    const lines = $('#bulk').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

      S.words.push({id:uid(), en, ja, sec, src, page:'', ex:'', note:'', box:0, due:t, ok:0, ng:0, created:t}); n++; });

    save('words'); render(); toast(`${n}語を追加しました${dup ? `（${dup}語は登録済み）` : ''}`);
  },
  qpool: el => { qs.pool = el.dataset.k; render(); },
  qmode: el => { qs.mode = el.dataset.k; render(); },
  startQuiz: () => startQuiz(poolWords()),
  pick: el => { const w = curW(), key = Q.mode === 'mc-ej' ? 'ja' : 'en'; Q.ans = +el.dataset.i; grade(Q.opts[Q.ans] === w[key]); render(); },
  reveal: () => { if (!Q.revealed) { Q.revealed = true; render(); } },
  self: el => { Q.ans = 1; grade(el.dataset.ok === '1'); nextQ(); },
  next: () => nextQ(),
  quitQuiz: () => { Q = null; render(); },
  retryWrong: () => { const ws = Q.res.filter(r=>!r.ok).map(r => S.words.find(w=>w.id===r.id)).filter(Boolean); const m = qs.n; qs.n = 999; startQuiz(ws); qs.n = m; },
  logQuiz: () => { const min = Math.max(1, Math.round((Q.end - Q.start)/60000)); S.logs.push({id:uid(), date:today(), skill:'voc', book:'app', min, text:`単語クイズ ${Q.res.filter(r=>r.ok).length}/${Q.res.length}`}); Q.logged = true; save('logs'); render(); toast('学習記録に追加しました'); },
  tmStart: () => { TM = {start:Date.now(), skill:$('#tm-skill').value, book:$('#tm-book').value}; try{localStorage.setItem(LS+'timer', JSON.stringify(TM));}catch(e){} render(); },
  tmStop: () => { const min = Math.max(1, Math.round((Date.now()-TM.start)/60000)); logPrefill = {min, skill:TM.skill, book:TM.book, date:today()}; TM = null; try{localStorage.removeItem(LS+'timer');}catch(e){} render(); $('#logFold')?.scrollIntoView({block:'start'}); toast(`${min}分 計測しました。内容を書いて記録してください`); },
  tmCancel: () => { TM = null; try{localStorage.removeItem(LS+'timer');}catch(e){} render(); },
  delLog: el => { S.logs = S.logs.filter(l => l.id !== el.dataset.id); save('logs'); render(); },
  moreLogs: () => { logShow += 30; render(); },
  delMock: el => { S.mocks = S.mocks.filter(m => m.id !== el.dataset.id); save('mocks'); render(); },
  wkind: el => { wr.kind = el.dataset.k; saveDraft(); render(); },
  wrStart: () => { wr.start = Date.now(); saveDraft(); render(); },
  saveEssay: () => {
    const n = wcount(wr.text); if (!n) return;
    const score = [0,1,2,3].reduce((a,i)=>a + +$('#ws-'+i).value, 0);
    const min = wr.start ? Math.max(1, Math.round((Date.now()-wr.start)/60000)) : WK[wr.kind].min;
    S.essays.push({id:uid(), date:today(), kind:wr.kind, topic:wr.topic, text:wr.text, words:n, score, min});
    S.logs.push({id:uid(), date:today(), skill:wr.kind, book:'app', min, text:`${WK[wr.kind].n}: ${wr.topic||'（無題）'} ${n}語 自己採点${score}/16`});
    save('essays'); save('logs'); wr = {kind:wr.kind, text:'', topic:'', start:null}; saveDraft(); render(); toast('保存しました');
  },
  delEssay: el => { S.essays = S.essays.filter(e => e.id !== el.dataset.id); save('essays'); render(); },
  export: async () => {
    const data = backupJson(), name = `eiken-pre1-backup-${today()}.json`;
    // claude.ai: 専用の保存ダイアログ / GitHub Pages など: スマホは共有シート、PCは通常のダウンロード
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (dl) { try { const r = await dl.save({filename:name, data}); if (r?.status === 'saved') { markBackup(); toast('バックアップを保存しました'); } } catch(e){ if (e?.code !== 'cancelled' && e?.code !== 'declined') toast('保存できませんでした。「テキストをコピー」を使ってください'); } return; }
    const file = new File([data], name, {type:'application/json'});
    if (navigator.canShare?.({files:[file]})) {
      try { await navigator.share({files:[file], title:'合格デスク バックアップ'}); markBackup(); toast('バックアップを渡しました'); return; }
      catch(e){ if (e?.name === 'AbortError') return; }
    }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      markBackup(); toast('バックアップを保存しました');
    } catch(e){ toast('保存できませんでした。「テキストをコピー」を使ってください'); }
  },
  copyJson: async () => {
    const data = backupJson();
    try { await navigator.clipboard.writeText(data); markBackup(); toast('バックアップのテキストをコピーしました'); }
    catch(e){ const t = $('#pasteJson'); if (t) { t.closest('details').open = true; t.value = data; t.select(); } toast('コピーできなかったので、欄に表示しました。長押しでコピーしてください'); }
  },
  pasteImport: () => readBackup($('#pasteJson').value),
  applyImport: el => applyImport(el.dataset.mode),
  cancelImport: () => { pendingImport = null; render(); }
};
const backupJson = () => JSON.stringify({app:'eiken-pre1-desk', v:2, at:new Date().toISOString(), ...S});
function markBackup(){ try { localStorage.setItem(LS+'lastBackup', today()); } catch(e){} }
function lastBackup(){ try { return localStorage.getItem(LS+'lastBackup'); } catch(e){ return null; } }
let pendingImport = null;
function readBackup(text){
  try { const d = JSON.parse(String(text||'').trim()); if (d?.app !== 'eiken-pre1-desk') throw 0; pendingImport = d; tab = 'more'; render(); window.scrollTo(0,0); }
  catch(e){ toast('合格デスクのバックアップとして読み込めませんでした'); }
}
// 統合: 両方の記録を残す。同じ単語（つづりが同じ）はクイズ回数の多い方、同じTODOは完了している方を残す
function mergeArr(k, cur, inc){
  const key = x => k === 'words' ? 'w:' + String(x.en||'').trim().toLowerCase() : x.id;
  const tries = x => (+x.ok||0) + (+x.ng||0);
  const m = new Map(cur.map(x => [key(x), x])); let add = 0;
  inc.forEach(x => {
    if (!x || !x.id) return;
    const kk = key(x), c = m.get(kk);
    if (!c) { m.set(kk, x); add++; return; }
    const newer = k === 'words' ? tries(x) > tries(c) || (tries(x) === tries(c) && (x.last||'') > (c.last||''))
      : k === 'todos' ? x.done && !c.done : false;
    if (newer) m.set(kk, x);
  });
  return {arr:[...m.values()], add};
}
function applyImport(mode){
  const d = pendingImport; if (!d) return;
  let msg;
  if (mode === 'replace') {
    KEYS.forEach(k => { if (d[k]) { S[k] = k === 'settings' ? fixSettings(d[k]) : d[k]; save(k); } });
    msg = 'バックアップの内容に置き換えました';
  } else {
    let add = 0;
    ['words','todos','logs','mocks','essays'].forEach(k => { if (!Array.isArray(d[k])) return; const r = mergeArr(k, S[k], d[k]); S[k] = r.arr; add += r.add; save(k); });
    if (d.settings) { S.settings = fixSettings({...S.settings, ...d.settings, kyoDone: Math.max(+S.settings.kyoDone||0, +d.settings.kyoDone||0)}); save('settings'); }
    msg = `統合しました（${add}件を追加）`;
  }
  pendingImport = null; render(); toast(msg);
}
function nextQ(){ Q.i++; if (Q.i >= Q.items.length) { Q.finished = true; Q.end = Date.now(); } else prepQ(); render(); }
function saveDraft(){ try { localStorage.setItem(LS+'draft', JSON.stringify(wr)); } catch(e){} }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') e.preventDefault();
  ACT[el.dataset.act]?.(el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest?.('.sheet-zone')) { ACT.reveal(); return; }
  if (tab !== 'quiz' || !Q || Q.finished) return;
  if (e.target.matches('input,textarea,select')) return;
  if (Q.mode.startsWith('mc') && Q.ans == null && /^[1-4]$/.test(e.key)) { const b = document.querySelector(`.opt[data-i="${+e.key-1}"]`); if (b) { e.preventDefault(); ACT.pick(b); } }
  else if (Q.mode === 'card' && !Q.revealed && e.key === ' ') { e.preventDefault(); ACT.reveal(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.inp; if (!k) return;
  if (k === 'wq') { wf.q = e.target.value; wShow = 60; render(); }
  if (k === 'topic') { wr.topic = e.target.value; saveDraft(); }
  if (k === 'essay') { wr.text = e.target.value; saveDraft();
    const n = wcount(wr.text), kk = WK[wr.kind], scale = Math.max(kk.hi*1.4, n+5);
    $('#wcN').textContent = n; $('#wcMsg').innerHTML = wcMsg(n,kk); $('#wcPin').style.left = Math.min(100, n/scale*100)+'%';
    document.querySelector('.range .zone').style.cssText = `left:${kk.lo/scale*100}%;width:${(kk.hi-kk.lo)/scale*100}%`;
    const b = document.querySelector('[data-act="saveEssay"]'); if (b) b.disabled = !n; }
});
document.addEventListener('change', async e => {
  const k = e.target.dataset.chg; if (!k) return;
  if (k === 'wsec') { wf.sec = e.target.value; render(); }
  if (k === 'qsec') { qs.sec = e.target.value; render(); }
  if (k === 'qn') { qs.n = +e.target.value; render(); }
  if (k === 'kyoTotal') { S.settings.kyoTotal = Math.max(1, +e.target.value || 1); S.settings.kyoDone = Math.min(S.settings.kyoDone, S.settings.kyoTotal); save('settings'); render(); }
  if (k === 'import') {
    const f = e.target.files?.[0]; if (!f) return;
    readBackup(await f.text()); e.target.value = '';
  }
});
document.addEventListener('submit', e => {
  const f = e.target, k = f.dataset.form; if (!k) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  if (k === 'settings') { Object.assign(S.settings, {exam:v.exam, exam2a:v.exam2a, exam2b:v.exam2b, exam2pick:v.exam2pick, daily:Math.max(5, +v.daily || 40), dailyMin:Math.max(30, +v.dailyMin || 120)}); S.settings = fixSettings(S.settings); save('settings'); render(); toast('保存しました'); }
  if (k === 'word') {
    const en = v.en.trim(), ja = v.ja.trim(); if (!en || !ja) return;
    lastSec = v.sec; lastSrc = v.src;
    if (editing) { const w = S.words.find(x => x.id === editing); Object.assign(w, {en, ja, sec:v.sec, src:v.src, page:v.page, ex:v.ex, note:v.note}); delete w.sample; editing = null; toast('更新しました'); }
    else {
      const ex = S.words.find(w => w.en.toLowerCase() === en.toLowerCase());
      if (ex) { ex.box = 0; ex.due = today(); toast('登録済みの単語です。復習待ちに戻しました'); }
      else { S.words.push({id:uid(), en, ja, sec:v.sec, src:v.src, page:v.page, ex:v.ex, note:v.note, box:0, due:today(), ok:0, ng:0, created:today()}); toast(`「${en}」を追加しました`); }
    }
    save('words'); render(); $('#w-en').focus();
  }
  if (k === 'spell') {
    if (Q.ans != null) return;
    const w = curW(), a = (v.a||'').trim().toLowerCase().replace(/\s+/g,' ');
    Q.ans = 1; grade(a === w.en.toLowerCase()); render();
  }
  if (k === 'todo') { S.todos.push({id:uid(), title:v.title.trim(), skill:v.skill, book:v.book, date:v.date || today(), min:+v.min || 30, done:false}); save('todos'); tf = (v.date || today()) > today() ? 'week' : 'today'; render(); toast('TODOを追加しました'); }
  if (k === 'log') { S.logs.push({id:uid(), date:v.date || today(), skill:v.skill, book:v.book, min:+v.min, text:v.text.trim()}); logPrefill = null; save('logs'); render(); toast('記録しました'); }
  if (k === 'mock') {
    const s = {}; let any = false; MOCK.forEach(x => { const val = v[x.k]; s[x.k] = val === '' ? '' : Math.max(0, Math.min(x.max, +val)); if (val !== '') any = true; });
    if (!any) { toast('少なくとも1つの大問の点数を入れてください'); return; }
    S.mocks.push({id:uid(), date:v.date || today(), round:+v.round, lap:+v.lap, label:v.label.trim(), s, memo:v.memo.trim()});
    save('mocks'); render(); toast('過去問の結果を記録しました');
  }
});

// claude.ai の外（GitHub Pages など）で開いたときだけ、7日以上バックアップしていなければ知らせる
function backupDue(){
  if (window.claude) return false;
  const real = ['words','todos','logs','mocks','essays'].some(k => S[k].some(x => !x.sample));
  const lb = lastBackup();
  return real && (!lb || diffDays(lb, today()) >= 7);
}

if (!loadLocal()) seedExamples();
render();
initRemote();
